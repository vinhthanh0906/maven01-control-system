/*
  rover_control_system.ino (Optimized for Low Latency)
  Wemos R32 D1 — AP mode UDP control + DHT11 + INA219

  Updated Pin Wiring Matrix:
  ┌──────────┬───────────┐
  │ L298N    │ Wemos R32 │
  ├──────────┼───────────┤
  │ IN1      │ IO16      │
  │ IN2      │ IO17      │
  │ IN3      │ IO25      │
  │ IN4      │ IO26      │
  │ ENA/ENB  │ jumpered  │
  ├──────────┼───────────┤
  │ DHT11    │           │
  │ VCC      │ 3.3V      │
  │ DATA     │ IO27      │
  │ GND      │ GND       │
  ├──────────┼───────────┤
  │ INA219   │           │
  │ VCC      │ 3.3V      │
  │ GND      │ GND       │
  │ SCL      │ IO13      │ <--- Updated
  │ SDA      │ IO05      │ <--- Updated
  └──────────┴───────────┘
*/

#include <WiFi.h>
#include <WiFiUdp.h>
#include <ArduinoJson.h>
#include <DHT.h>
#include <Wire.h>
#include <Adafruit_INA219.h> // Required for INA219
#include "esp_wifi.h"        // Required for disabling Wi-Fi power save

// ── INA219 Config (I2C) ──────────────────────────────────────────────────────
const int I2C_SCL = 13;
const int I2C_SDA = 5;
Adafruit_INA219 ina219;

// Cached INA219 States
float busVoltage_V = 0.0;
float current_mA = 0.0;
float power_mW = 0.0;
bool inaOK = false;

// ── Access Point Config ───────────────────────────────────────────────────────
const char* AP_SSID     = "RoverAP";
const char* AP_PASSWORD = "rover1234";

// ── UDP Ports ─────────────────────────────────────────────────────────────────
const int UDP_RECV_PORT = 4210;
const int UDP_SEND_PORT = 4211;

// ── L298N Pins (Updated) ──────────────────────────────────────────────────────
#define IN1  16
#define IN2  17
#define IN3  25
#define IN4  26

// ── DHT11 Config (Updated) ────────────────────────────────────────────────────
#define DHT_PIN  27
#define DHT_TYPE DHT11
DHT dht(DHT_PIN, DHT_TYPE);

// ── Timing Context (Non-blocking) ─────────────────────────────────────────────
unsigned long lastDHTRead       = 0;
unsigned long lastINARead       = 0;
unsigned long lastTelemetrySent = 0;

const unsigned long DHT_INTERVAL       = 2000; // Read DHT every 2s
const unsigned long INA_INTERVAL       = 100;  // Read Power every 100ms (10Hz)
const unsigned long TELEMETRY_INTERVAL = 100;  // Stream telemetry every 100ms (10Hz)

// Cached Sensor States
float cachedTemp     = 0.0;
float cachedHumidity = 0.0;
bool  sensorOK       = false;

// ── System State ──────────────────────────────────────────────────────────────
WiFiUDP   udp;
IPAddress pcIP;
bool      pcKnown    = false;
String    currentCmd   = "stop";
int       currentSpeed = 0;
unsigned long tickCount = 0;

// ── Motor Control Execution ───────────────────────────────────────────────────
void motorStop() {
  digitalWrite(IN1, LOW); digitalWrite(IN2, LOW);
  digitalWrite(IN3, LOW); digitalWrite(IN4, LOW);
}

void motorForward() {
  digitalWrite(IN1, HIGH); digitalWrite(IN2, LOW);
  digitalWrite(IN3, HIGH); digitalWrite(IN4, LOW);
}

void motorBackward() {
  digitalWrite(IN1, LOW);  digitalWrite(IN2, HIGH);
  digitalWrite(IN3, LOW);  digitalWrite(IN4, HIGH);
}

void motorLeft() {
  digitalWrite(IN1, HIGH); digitalWrite(IN2, LOW);
  digitalWrite(IN3, LOW);  digitalWrite(IN4, HIGH);
}

void motorRight() {
  digitalWrite(IN1, LOW);  digitalWrite(IN2, HIGH);
  digitalWrite(IN3, HIGH); digitalWrite(IN4, LOW);
}

void applyCommand(const String& cmd, int spd) {
  currentCmd   = cmd;
  currentSpeed = (cmd == "stop") ? 0 : spd;
  
  if      (cmd == "forward")  motorForward();
  else if (cmd == "backward") motorBackward();
  else if (cmd == "left")     motorLeft();
  else if (cmd == "right")    motorRight();
  else                        motorStop();
}

// ── Sensor Sampling ───────────────────────────────────────────────────────────
void readDHT() {
  float h = dht.readHumidity();
  float t = dht.readTemperature();
  if (isnan(h) || isnan(t)) {
    sensorOK = false;
  } else {
    cachedTemp     = t;
    cachedHumidity = h;
    sensorOK       = true;
  }
}

void readINA() {
  if (!inaOK) return;
  
  busVoltage_V = ina219.getBusVoltage_V();
  current_mA   = ina219.getCurrent_mA();
  power_mW     = ina219.getPower_mW();
}

// ── Asynchronous Telemetry Delivery ──────────────────────────────────────────
void sendTelemetry() {
  if (!pcKnown) return;

  tickCount++;
  StaticJsonDocument<384> doc; 
  doc["status"]      = "ok";
  doc["cmd"]         = currentCmd;
  doc["speed"]       = currentSpeed;
  doc["uptime"]      = millis() / 1000;
  doc["tick"]        = tickCount;
  
  // Package Power Data into JSON
  JsonObject power = doc.createNestedObject("power");
  power["bus_v"]      = inaOK ? round(busVoltage_V * 100) / 100.0 : 0.0;
  power["current_mA"] = inaOK ? round(current_mA * 10) / 10.0 : 0.0;
  power["power_mW"]   = inaOK ? round(power_mW * 10) / 10.0 : 0.0;

  doc["temperature"] = sensorOK ? round(cachedTemp * 10) / 10.0     : 0;
  doc["humidity"]    = sensorOK ? round(cachedHumidity * 10) / 10.0 : 0;
  doc["sensor_ok"]   = sensorOK;
  doc["ina_ok"]      = inaOK;

  char buf[384];
  serializeJson(doc, buf);

  udp.beginPacket(pcIP, UDP_SEND_PORT);
  udp.print(buf);
  udp.endPacket();
}
// ── Setup ─────────────────────────────────────────────────────────────────────
void setup() {
  Serial.begin(115200); 
  delay(500);
  Serial.println("\n=== High-Performance Rover System ===");

  pinMode(IN1, OUTPUT); pinMode(IN2, OUTPUT);
  pinMode(IN3, OUTPUT); pinMode(IN4, OUTPUT);
  motorStop();

  dht.begin();

  // Initialize Custom I2C Bus for INA219
  Wire.begin(I2C_SDA, I2C_SCL);

  // Initialize INA219
  if (!ina219.begin()) {
    Serial.println("[ERROR] INA219 chip not found! Check wiring.");
    inaOK = false;
  } else {
    Serial.println("[SUCCESS] INA219 Initialized.");
    inaOK = true;
    // ina219.setCalibration_32V_2A(); // Uncomment if you need specific calibration
  }

  // Initialize Wireless Hardware
  WiFi.mode(WIFI_AP);
  WiFi.softAP(AP_SSID, AP_PASSWORD);
  
  WiFi.setSleep(false);
  esp_wifi_set_ps(WIFI_PS_NONE); 

  udp.begin(UDP_RECV_PORT);
  Serial.println("[READY] System operational loop running.");
}

// ── Core Execution Loop ───────────────────────────────────────────────────────
void loop() {
  unsigned long now = millis();

  // 1. Instantly Check and Parse Command Packets
  int packetSize = udp.parsePacket();
  if (packetSize > 0) {
    char buf[128];
    int len = udp.read(buf, sizeof(buf) - 1);
    if (len > 0) {
      buf[len] = '\0';
      pcIP    = udp.remoteIP();
      pcKnown = true;

      StaticJsonDocument<128> doc;
      DeserializationError err = deserializeJson(doc, buf);
      if (!err) {
        const char* cmd = doc["cmd"] | "stop";
        int speed       = doc["speed"] | 150;
        applyCommand(String(cmd), speed);
      }
    }
  }

  // 2. Sample Power Data (Asynchronous - 10Hz)
  if (now - lastINARead >= INA_INTERVAL) {
    lastINARead = now;
    readINA();
  }

  // 3. Stream Telemetry Data Back to Python Host (Asynchronous - 10Hz)
  if (now - lastTelemetrySent >= TELEMETRY_INTERVAL) {
    lastTelemetrySent = now;
    sendTelemetry();
  }

  // 4. Sample Ambient Environmental Conditions (Asynchronous - 0.5Hz)
  if (now - lastDHTRead >= DHT_INTERVAL) {
    lastDHTRead = now;
    readDHT();
  }

  // 5. Print to Serial Monitor (Asynchronous - 1Hz)
  static unsigned long lastSerialPrint = 0; // Local static timer
  if (now - lastSerialPrint >= 1000) {      // Triggers every 1000ms (1 second)
    lastSerialPrint = now;
    
    Serial.print("[Sensors] Temp: ");
    Serial.print(sensorOK ? cachedTemp : 0.0);
    Serial.print(" °C  |  Humidity: ");
    Serial.print(sensorOK ? cachedHumidity : 0.0);
    Serial.print(" %  |  Voltage: ");
    Serial.print(inaOK ? busVoltage_V : 0.0);
    Serial.println(" V");
  }
}